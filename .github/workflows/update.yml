name: Update trades and deploy Pages

on:
  schedule:
    - cron: '17 22 * * *' # Every day 07:17 KST (UTC previous day)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: home2033-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector, calculations and deployment contract
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/core.test.mjs
          node --check assets/app.js
      - name: Fetch official transactions
        id: collect
        if: github.event_name != 'push' || hashFiles('data/nationwide/index.json') == ''
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python update.py
      - name: Commit last-good data and collection status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/trades.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update apartment transactions and collection status'
            git push
          fi
      - name: Fetch nationwide apartment search data
        id: nationwide
        if: github.event_name != 'push' || hashFiles('data/nationwide/index.json') == ''
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/collect_nationwide.py
      - name: Commit nationwide last-good snapshots
        run: |
          if [ -d data/nationwide ]; then git add data/nationwide; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update nationwide apartment search data'
            git push
          fi
      - name: Check requested Gyeonggi trend coverage
        id: gyeonggi
        if: github.event_name == 'push' && hashFiles('data/trends/index.json') != ''
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.collect_trends import GYEONGGI_BACKFILL_CODES

          index = json.loads(Path('data/trends/index.json').read_text(encoding='utf-8'))
          complete = {d['code'] for d in index['districts'] if d.get('memberMonths') == d['totalMonths'] == 120}
          pending = not complete.issuperset(GYEONGGI_BACKFILL_CODES)
          print(f'pending={str(pending).lower()}')
          PY
      - name: Collect resumable ten-year regional trend statistics
        id: trends
        if: github.event_name != 'push' || steps.gyeonggi.outputs.pending == 'true' || hashFiles('data/trends/index.json') == '' || hashFiles('data/trends/v2.complete.json') == '' || hashFiles('data/trends/complex-coverage-v2.json') == '' || hashFiles('data/trends/seoul-coverage.json') == ''
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          GYEONGGI_TREND_BACKFILL: ${{ steps.gyeonggi.outputs.pending == 'true' }}
          HISTORY_MONTH_BUDGET: ${{ steps.gyeonggi.outputs.pending == 'true' && '1080' || github.event_name == 'push' && (hashFiles('data/trends/index.json') != '' && hashFiles('data/trends/seoul-coverage.json') == '' && '3000' || (hashFiles('data/trends/complex-coverage.json') != '' && '0' || '360')) || '1400' }}
          SEOUL_TREND_BACKFILL: ${{ steps.gyeonggi.outputs.pending != 'true' && github.event_name == 'push' && hashFiles('data/trends/index.json') != '' && hashFiles('data/trends/seoul-coverage.json') == '' }}
          REFRESH_TREND_HOUSEHOLDS: '1'
        run: python scripts/collect_trends.py
      - name: Commit regional trend statistics
        run: |
          if [ -d data/trends ]; then git add data/trends; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update regional ten-year trend statistics'
            git push
          fi
      - name: Prepare public static files
        run: python scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy latest data directly
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for Pages artifact metadata after transient failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment after artifact propagation
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing last-good data
        if: steps.collect.outcome == 'failure' || steps.nationwide.outcome == 'failure' || steps.trends.outcome == 'failure'
        run: |
          echo "::error::Official API collection failed. Last-good prices were retained and the failure status was deployed."
          exit 1

